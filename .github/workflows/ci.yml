name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make libgtest-dev
    
    - name: Build and test InplaceSorting
      run: |
        cd 01.InplaceSorting
        make clean || true
        make all
    
    - name: Build and test Base85
      run: |
        cd 02.Base85
        make clean || true
        make all
